<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">

    <title>Page introuvable - Tiny Act</title>

    <style>
      :root {
        --bg-start: #fff8ef;
        --bg-end: #ffe8d8;
        --surface: rgba(255, 255, 255, 0.88);
        --text: #17362f;
        --muted: rgba(23, 54, 47, 0.68);
        --red: #ff3b30;
        --green: #47d0b0;
        --yellow: #ffd166;
        --border: rgba(23, 54, 47, 0.12);
        --shadow: 0 24px 70px rgba(37, 24, 14, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 14% 10%, rgba(255, 59, 48, 0.22), transparent 34%),
          radial-gradient(circle at 86% 18%, rgba(71, 208, 176, 0.22), transparent 30%),
          linear-gradient(180deg, var(--bg-start), var(--bg-end));
      }

      .error-page {
        width: min(100%, 460px);
        position: relative;
      }

      .error-card {
        position: relative;
        overflow: hidden;
        padding: 28px;
        border-radius: 34px;
        border: 1px solid var(--border);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .error-card::before {
        content: "";
        position: absolute;
        right: -58px;
        top: -58px;
        width: 180px;
        height: 180px;
        border-radius: 999px;
        background: rgba(255, 59, 48, 0.14);
      }

      .error-card::after {
        content: "";
        position: absolute;
        left: -42px;
        bottom: -54px;
        width: 150px;
        height: 150px;
        border-radius: 999px;
        background: rgba(71, 208, 176, 0.14);
      }

      .error-content {
        position: relative;
        z-index: 1;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 28px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.76);
        border: 1px solid var(--border);
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.02em;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 8px;
        color: #ffffff;
        background: var(--red);
        font-size: 0.78rem;
      }

      .code {
        margin: 0 0 6px;
        color: var(--red);
        font-size: clamp(4.5rem, 24vw, 8rem);
        font-weight: 1000;
        line-height: 0.86;
        letter-spacing: -0.1em;
      }

      h1 {
        margin: 0 0 14px;
        max-width: 9ch;
        font-size: clamp(2rem, 10vw, 3.6rem);
        font-weight: 1000;
        line-height: 0.9;
        letter-spacing: -0.08em;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.5;
      }

      .micro-action {
        margin-top: 20px;
        padding: 16px;
        border-radius: 24px;
        background: rgba(255, 209, 102, 0.24);
        border: 1px solid rgba(23, 54, 47, 0.1);
      }

      .actions {
        display: grid;
        gap: 10px;
        margin-top: 24px;
      }

      .primary-link,
      .secondary-link {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 54px;
        border-radius: 18px;
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 950;
      }

      .primary-link {
        color: #ffffff;
        background: var(--red);
        box-shadow: 0 16px 30px rgba(255, 59, 48, 0.22);
      }

      .secondary-link {
        color: var(--text);
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid var(--border);
      }

      .footer-note {
        margin-top: 16px;
        text-align: center;
        color: rgba(23, 54, 47, 0.5);
        font-size: 0.82rem;
        font-weight: 700;
      }

      @media (min-width: 720px) {
        .error-card {
          padding: 36px;
        }

        .actions {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>

  <body>
    <main class="error-page">
      <section class="error-card">
        <div class="error-content">
          <div class="brand">
            <span class="brand-mark">✦</span>
            <span>Tiny Act</span>
          </div>

          <p class="code">404</p>

          <h1>Cette page s’est perdue.</h1>

          <p>
            Le lien n’existe plus, a changé d’adresse, ou n’a jamais vraiment commencé.
          </p>

          <div class="micro-action">
            <p>
              On peut repartir simplement : une petite action vaut mieux qu’un long détour.
            </p>
          </div>

          <div class="actions">
            <a class="primary-link" href="/">Retour à l’accueil</a>
            <a class="secondary-link" href="javascript:history.back()">Page précédente</a>
          </div>
        </div>
      </section>

      <p class="footer-note">Stop scrolling. Start doing.</p>
    </main>
  </body>
</html>
